# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

# Human-gated: a published GitHub Release, or Actions → Publish → Run workflow.
# Never runs on push. Requires repository secret NPM_TOKEN (npm automation token).
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'kkabala/retemper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
